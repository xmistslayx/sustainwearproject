<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Complete Your Profile | SustainWear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <div class="container py-5">
    <div class="mx-auto shadow-sm p-4 bg-white rounded" style="max-width: 480px;">

      <h2 class="fw-bold mb-3 text-center">Complete Your Profile</h2>
      <p class="text-muted small text-center mb-4">
        We just need a few more details.
      </p>

      <div id="profileAlert" class="alert alert-danger d-none"></div>

      <form id="profileForm">

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input id="profName" type="text" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input id="profPhone" type="text" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea id="profAddress" class="form-control" rows="2" required></textarea>
        </div>

        <button class="btn btn-primary w-100 mt-3" type="submit">
          Save & Continue
        </button>

      </form>
    </div>
  </div>

  <script type="module" src="/js/complete-profile.js"></script>
</body>
</html>
