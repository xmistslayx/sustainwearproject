      <a class="navbar-brand fw-bold" href="/">SustainWear</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>

        </ul>

        <div class="d-flex align-items-center gap-3 ms-3">
          <button id="loginBtn" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            Sign in with Google
          </button>

          <div id="userMenu" class="dropdown d-none">
            <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2 py-1 px-2" data-bs-toggle="dropdown">
              <img id="userAvatar" class="avatar" alt="User Avatar">
              <span id="userName" class="d-none d-sm-inline small"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" id="logoutBtn">Sign out</a></li>
            </ul>
          </div>

    </div>

  <!-- Main Content -->
  <main>
    <section class="donate-section">
      <div class="container">
        <div class="text-center mb-5">
          <h1 class="fw-bold display-6">Donate Clothes</h1>
          <p class="text-muted lead">Submit your clothing donations to help support local communities.</p>
        </div>

        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <form id="donationForm" class="shadow-sm p-4 rounded bg-light">
              
              <div class="mb-3">
                <label class="form-label fw-semibold">Item Name</label>
                <input id="itemName" type="text" class="form-control" placeholder="e.g. Winter Jacket" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Category</label>
                <select id="itemCategory" class="form-select" required>
                  <option value="">Select category</option>
                  <option value="men">Men</option>
                  <option value="women">Women</option>
                  <option value="children">Children</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Condition</label>
                <select id="itemCondition" class="form-select" required>
                  <option value="">Select condition</option>
                  <option value="new">New</option>
                  <option value="good">Good</option>
                  <option value="used">Used</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea id="itemDescription" class="form-control" rows="3" placeholder="Add additional details..."></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">Submit Donation</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer> … (unchanged) … </footer>

</body>
